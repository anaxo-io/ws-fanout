[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # webpki-roots ships Mozilla's CA certificate data under a permissive data licence.
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false

[[bans.deny]]
name = "openssl"
reason = "no TLS in this crate; a transitive openssl pull-in is a mistake"

[advisories]
yanked = "deny"
ignore = [
  # Marvin attack: key recovery from timing RSA private-key operations. The `rsa`
  # crate arrives through jsonwebtoken's `rust_crypto` backend, which bundles every
  # algorithm; this crate validates HS256 only, so no RSA key is ever constructed
  # and no RSA code path runs. No patched `rsa` exists to move to.
  { id = "RUSTSEC-2023-0071", reason = "rsa is compiled in by jsonwebtoken's rust_crypto bundle and never called: HS256 only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

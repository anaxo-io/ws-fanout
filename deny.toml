[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # webpki-roots ships Mozilla's CA certificate data under a permissive data licence.
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false

[[bans.deny]]
name = "openssl"
reason = "no TLS in this crate; a transitive openssl pull-in is a mistake"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
# outcry is an optional git dependency until it is published to crates.io.
unknown-git = "allow"
allow-git = ["https://github.com/anaxo-io/outcry"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features jwt -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --features jwt

  outcry:
    # The `outcry` feature pulls a git dependency from a repository that is private until
    # its public release. GITHUB_TOKEN cannot read it, so this job is advisory until
    # then; it becomes required once both repositories are public.
    name: test (outcry feature)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --features outcry,jwt -- -D warnings
      - run: cargo test --features outcry,jwt

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --features jwt

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: rm -f rust-toolchain.toml
      - run: cargo check --all-targets --features jwt

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # cargo-deny resolves the whole graph, including the private `outcry` git source
      # GITHUB_TOKEN cannot read. Until outcry is public, the dependency is stripped
      # from the manifest for this check only; it is exercised by the outcry job.
      - run: sed -i '/^outcry = /d; /^\[\[example\]\]/,/^$/d' Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@v2

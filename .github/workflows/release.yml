name: Release

# Cuts the GitHub release for a `vX.Y.Z` tag. The procedure this completes, and the
# branch rules that go with it, are in
# https://github.com/anaxo-io/.github/blob/main/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # Trusted Publishing: GitHub proves this workflow's identity to crates.io

jobs:
  release:
    uses: anaxo-io/.github/.github/workflows/release-rust.yml@main
  publish:
    needs: release
    uses: anaxo-io/.github/.github/workflows/publish-rust.yml@main
    permissions:
      contents: read
      id-token: write

name: Release

# Cuts the GitHub release for a `vX.Y.Z` tag. The procedure this completes, and the
# branch rules that go with it, are in
# https://github.com/anaxo-io/.github/blob/main/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: anaxo-io/.github/.github/workflows/release-rust.yml@main

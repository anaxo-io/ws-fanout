name: Bug report
description: Something behaves differently from what the documentation says
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: >
        A failing test or a short `main` that shows the problem. This is the single most
        useful thing you can provide.
      render: rust
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Crate version or commit SHA.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: rust-version
    attributes:
      label: Rust version
      description: Output of `rustc --version`.
    validations:
      required: true
